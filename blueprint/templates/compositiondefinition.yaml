apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  chart:
    {{- $url := .Values.blueprint.url }}
    {{- if not (hasPrefix "oci://" $url) }}
    repo: {{ default .Values.global.compositionName .Values.blueprint.repo }} # If empty, the global.compositionName value will be used for retrocompatibility to portal-blueprint-version 1.0.5
    {{- end }}
    url: {{ $url | quote }}
    version: {{ .Values.blueprint.version }}
    {{- with .Values.blueprint.credentials }}
    credentials:
      {{- with .username }}
      username: {{ . | quote }}
      {{- end }}
      {{- with .passwordRef }}
      passwordRef:
        {{- with .key }}
        key: {{ . | quote }}
        {{- end }}
        {{- with .name }}
        name: {{ . | quote }}
        {{- end }}
        {{- with .namespace }}
        namespace: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}