{{- if eq .Values.form.hasPage true }}
kind: Row
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: {{ .Release.Name }}-form-page-row
  namespace: {{ .Release.Namespace }}
spec:
  widgetData:
    allowedResources:
      - panels
    items:
      - resourceRefId: form-page-panel-form
      - resourceRefId: form-page-panel-markdown
  resourcesRefs:
    items:
      - id: form-page-panel-form
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: {{ .Release.Name }}-form-page-panel-form
        namespace: {{ .Release.Namespace }}
        resource: panels
        verb: GET
      - id: form-page-panel-markdown
        apiVersion: widgets.templates.krateo.io/v1beta1
        name: {{ .Release.Name }}-form-page-panel-markdown
        namespace: {{ .Release.Namespace }}
        resource: panels
        verb: GET
{{- end }}