kind: Markdown
apiVersion: widgets.templates.krateo.io/v1beta1
metadata:
  name: {{ .Release.Name }}-panel-markdown
  namespace: {{ .Release.Namespace }}
spec:
  widgetData:
    {{- $compositionName := .Values.blueprint.repo | default ((.Values.global | default dict).compositionName) | default "" }}
    {{- $formType := .Values.form.alphabeticalOrder | ternary "_Custom Resource Definition_ order form" "_values.schema.json_ order form" }}
    markdown: Click here to deploy a **{{ $compositionName }}** composition ({{ $formType }})
